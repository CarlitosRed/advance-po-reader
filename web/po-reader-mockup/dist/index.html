<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="A sample purchase-order review: check every line, then approve your reviewed products.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Review your purchase order · SmarterCommerce</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2300467f'/%3E%3Cpath d='M10 7h9l4 4v14H10z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="sample-catalog.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <div class="brand"><span class="brand-mark"><img src="assets/werner.jpg" width="100" height="100" alt="Werner"></span><span class="brand-divider"></span><span>Purchase<br class="phone-break"> Order Reader</span></div>
    <span class="demo-tag">Sample demo</span>
  </div></header>
  <main id="main-content" class="shell">
    <nav class="steps" aria-label="Purchase order review progress">
      <span id="step-upload" class="step" aria-current="step"><span class="step-number">1</span>Upload</span><span class="step-line"></span>
      <span id="step-review" class="step"><span class="step-number">2</span>Review</span><span class="step-line"></span>
      <span id="step-approve" class="step"><span class="step-number">3</span>Approve</span>
    </nav>
    <div id="view"></div>
    <noscript><p class="notice">Enable JavaScript to explore this sample review.</p></noscript>
  </main>
  <footer class="site-footer"><span>Source evidence. Your decisions.</span><span class="powered-by">Powered by <img src="assets/smartercommerce.png" width="145" height="30" alt="SmarterCommerce"></span></footer>
  <div id="status-message" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="preview-dialog" aria-labelledby="preview-title"><div class="dialog-heading"><h2 id="preview-title">Original sample document</h2><button id="close-preview" class="button secondary">Close</button></div><div id="preview-content"></div></dialog>
</body>
</html>
