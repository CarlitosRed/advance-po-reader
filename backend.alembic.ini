[alembic]
script_location = %(here)s/backend_migrations
version_locations =
    %(here)s/migrations/versions
    %(here)s/backend_migrations/versions
prepend_sys_path = %(here)s
path_separator = newline

# Local backend Settings supplies the URL; no secret belongs in this file.

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
