name: Gate audit
# Detective control. After every push to main, check that each new commit carries a Gate-Record line
# (written only by the pinned framework's `tools/gate/gate.py merge`, per .orchestration/framework.pin).
# If one does not, open an issue so Carlos sees it. tools/gate/po_gate.py is no longer invoked here
# (cut over 2026-10-15) but stays in the repo per the framework's migration note; it is not deleted yet.
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read this project's framework pin
        id: pin
        run: |
          repo=$(grep '^repo:' .orchestration/framework.pin | sed 's/^repo: *//')
          tag=$(grep '^tag:' .orchestration/framework.pin | sed 's/^tag: *//')
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned framework (shallow, at the pinned tag only)
        env:
          FRAMEWORK_PIN_TOKEN: ${{ secrets.FRAMEWORK_PIN_TOKEN }}
        run: |
          if [ -z "$FRAMEWORK_PIN_TOKEN" ]; then
            echo "::error::FRAMEWORK_PIN_TOKEN secret is not set. The framework repo is private, so a plain" \
                 "clone fails here with a cryptic git error - see agent-orchestration/adapters/README.md," \
                 "'Private framework repo access'." >&2
            exit 1
          fi
          # Strip any stray whitespace/CRLF a copy-paste into the secret may have carried -- a PAT
          # never legitimately contains whitespace, and an embedded CR/space breaks the URL below
          # with curl's "Malformed input to a URL function" rather than an auth error.
          FRAMEWORK_PIN_TOKEN="$(printf '%s' "$FRAMEWORK_PIN_TOKEN" | tr -d '[:space:]')"
          repo_no_scheme="${{ steps.pin.outputs.repo }}"
          repo_no_scheme="${repo_no_scheme#https://}"
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" \
            "https://x-access-token:${FRAMEWORK_PIN_TOKEN}@${repo_no_scheme}" .framework-pin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the new commits
        id: audit
        shell: bash
        run: python .framework-pin/tools/gate/gate.py --config .orchestration/gate.json audit --range "${{ github.event.before }}..${{ github.sha }}" 2>&1 | tee audit.txt
      - name: Open an issue when the gate was bypassed
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "Gate bypassed on main (${GITHUB_SHA::8})" --body-file audit.txt
