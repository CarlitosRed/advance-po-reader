name: Local Gate A checks
on: [push, pull_request]
jobs:
  gate-a:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gate_a
          POSTGRES_PASSWORD: gate_a_local
          POSTGRES_DB: gate_a_test_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gate_a -d gate_a_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.gate-a.lock.txt
      - run: python -m pip check
      - run: python -m pytest -c pytest.gate-a.ini
        env:
          GATE_A_TEST_DATABASE_URL: postgresql+psycopg://gate_a:gate_a_local@127.0.0.1:55432/gate_a_test_ci
