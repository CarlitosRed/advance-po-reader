name: Python checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m unittest discover -s tests -v
  gate-tests:
    # Tests the pinned shared gate (.orchestration/framework.pin), cut over 2026-10-15.
    # tools/gate/test_po_gate.py still exists and still passes locally (the old tool isn't deleted
    # yet, per the framework's migration note) but is no longer the required check here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read this project's framework pin
        id: pin
        run: |
          repo=$(grep '^repo:' .orchestration/framework.pin | sed 's/^repo: *//')
          tag=$(grep '^tag:' .orchestration/framework.pin | sed 's/^tag: *//')
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned framework (shallow, at the pinned tag only)
        env:
          FRAMEWORK_PIN_TOKEN: ${{ secrets.FRAMEWORK_PIN_TOKEN }}
        run: |
          if [ -z "$FRAMEWORK_PIN_TOKEN" ]; then
            echo "::error::FRAMEWORK_PIN_TOKEN secret is not set. The framework repo is private, so a plain" \
                 "clone fails here with a cryptic git error - see agent-orchestration/adapters/README.md," \
                 "'Private framework repo access'." >&2
            exit 1
          fi
          repo_no_scheme="${{ steps.pin.outputs.repo }}"
          repo_no_scheme="${repo_no_scheme#https://}"
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" \
            "https://x-access-token:${FRAMEWORK_PIN_TOKEN}@${repo_no_scheme}" .framework-pin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .framework-pin/tools/gate -p "test_gate.py" -v
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read this project's framework pin
        id: pin
        run: |
          repo=$(grep '^repo:' .orchestration/framework.pin | sed 's/^repo: *//')
          tag=$(grep '^tag:' .orchestration/framework.pin | sed 's/^tag: *//')
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned framework (shallow, at the pinned tag only)
        env:
          FRAMEWORK_PIN_TOKEN: ${{ secrets.FRAMEWORK_PIN_TOKEN }}
        run: |
          if [ -z "$FRAMEWORK_PIN_TOKEN" ]; then
            echo "::error::FRAMEWORK_PIN_TOKEN secret is not set. The framework repo is private, so a plain" \
                 "clone fails here with a cryptic git error - see agent-orchestration/adapters/README.md," \
                 "'Private framework repo access'." >&2
            exit 1
          fi
          repo_no_scheme="${{ steps.pin.outputs.repo }}"
          repo_no_scheme="${repo_no_scheme#https://}"
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" \
            "https://x-access-token:${FRAMEWORK_PIN_TOKEN}@${repo_no_scheme}" .framework-pin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .framework-pin/tools/gate/gate.py --config .orchestration/gate.json scan --rev HEAD
